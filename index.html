
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>🔄 Unit Converter</h1>
        <p class="subtitle">Convert length and weight units easily</p>

        <div class="form-group">
            <label for="category">Conversion Type</label>
            <select id="category">
                <option value="length">Length</option>
                <option value="weight">Weight</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Enter Value</label>
            <input type="number" id="amount" placeholder="Enter a number" value="1" step="any">
        </div>

        <div class="form-group">
            <label for="fromUnit">From Unit</label>
            <select id="fromUnit"></select>
        </div>

        <button id="swapBtn" type="button">⇅ Swap Units</button>

        <div class="form-group">
            <label for="toUnit">To Unit</label>
            <select id="toUnit"></select>
        </div>

        <button id="convertBtn" type="button">Convert</button>

        <div class="result-box" aria-live="polite">
            <p>Converted Result</p>
            <h2 id="result">1.00</h2>
        </div>

        <p id="message" class="message"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
